{% extends "base.html" %}

{% block title %}{{ accion }} producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h3 mb-4">{{ accion }} producto</h1>

        <form method="post">
            <div class="mb-3">
                <label for="codigo" class="form-label">Código</label>
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    class="form-control"
                    maxlength="20"
                    value="{{ producto.codigo if producto else '' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    class="form-control"
                    maxlength="100"
                    value="{{ producto.nombre if producto else '' }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    class="form-control"
                    maxlength="50"
                    value="{{ producto.categoria if producto else '' }}"
                    required
                >
            </div>

            <div class="row">
                <div class="col-sm-6 mb-3">
                    <label for="precio" class="form-label">Precio (Q)</label>
                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        class="form-control"
                        step="0.01"
                        min="0.01"
                        value="{{ producto.precio if producto else '' }}"
                        required
                    >
                    <div class="form-text">Debe ser mayor que 0.</div>
                </div>
                <div class="col-sm-6 mb-3">
                    <label for="existencia" class="form-label">Existencia</label>
                    <input
                        type="number"
                        id="existencia"
                        name="existencia"
                        class="form-control"
                        step="1"
                        min="0"
                        value="{{ producto.existencia if producto else '' }}"
                        required
                    >
                    <div class="form-text">No puede ser negativa.</div>
                </div>
            </div>

            <div class="form-check mb-4">
                <input
                    type="checkbox"
                    id="activo"
                    name="activo"
                    class="form-check-input"
                    {% if (producto and producto.activo) or not producto %}checked{% endif %}
                >
                <label for="activo" class="form-check-label">Producto activo</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('listado') }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
